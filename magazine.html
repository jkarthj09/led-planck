<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LED 미끄럼틀 · 철수세미 잡지</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: 책상(desk) 위에 펼쳐진 잡지. PC = 두 쪽 펼침, 모바일 = 한 쪽. 스크롤 모드 = 한 줄 기사.
   잡지마다 고유 색(--acc)을 갖고, 종이·잉크 색은 공통. 종이 질감의 단일 밝은 테마로 의도적으로 고정. */
:root{
  color-scheme: light;
  --desk:#e6e1d6; --paper:#fffdf8; --ink:#1f2a30; --muted:#5f6a70; --line:#e2dbcd; --shade:#d3ccbe;
  --acc:#1f7a6e; --acc2:#ff7a59; --tint:#eaf4f1;
  --f-disp:'Jua','Nanum Gothic','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-body:'Nanum Gothic','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --bar-h:56px;
}
.m-doppler{--acc:#1f7a6e; --acc2:#ff7a59; --tint:#e6f3ef; --acc-ink:#0f3d38}
.m-gd{--acc:#c2461d; --acc2:#1d2b3a; --tint:#f7ece0; --acc-ink:#5a2310}
[hidden]{display:none!important}
*{box-sizing:border-box}html,body{height:100%}body{margin:0}img{max-width:100%}
body{background:var(--desk); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.75; -webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
b{font-weight:700;background:linear-gradient(transparent 58%, color-mix(in srgb,var(--acc2) 35%,transparent) 58%);padding:0 2px}

/* ---------- top bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:var(--bar-h);display:flex;align-items:center;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--paper);border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-disp);font-size:20px;letter-spacing:.02em;background:none;border:0;padding:0;white-space:nowrap}
.brand span{color:var(--acc)}
.bar .now{flex:1;min-width:0;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--desk)}
.seg button{border:0;background:none;padding:4px 12px;border-radius:999px;font-size:14px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--paper);box-shadow:0 1px 3px rgba(40,30,10,.15);color:var(--acc)}
.tocbtn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 14px;font-size:14px;white-space:nowrap}
@media (max-width:560px){body.reading .brand{display:none}body.reading .bar .now{display:block;flex:1;font-size:13px}.bar{gap:8px}.bar .now{display:none}.brand{font-size:18px;flex:1;text-align:left}.brand span{display:none}.seg button{padding:4px 9px;font-size:13px}.tocbtn{padding:5px 11px;font-size:13px}}

/* ---------- home ---------- */
#home{max-width:1080px;margin:0 auto;padding-block:40px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.home-h{font-family:var(--f-disp);font-size:clamp(30px,5vw,46px);line-height:1.2;margin:0 0 6px;text-wrap:balance}
.home-sub{color:var(--muted);margin:0 0 32px}
.shelf{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:28px}
.mag-card{background:var(--paper);border-radius:6px;overflow:hidden;box-shadow:0 1px 0 var(--shade),0 18px 40px -22px rgba(60,40,10,.45);display:flex;flex-direction:column;text-align:left;border:0;padding:0;transition:transform .2s}
.mag-card:hover{transform:translateY(-4px) rotate(-.4deg)}
.mag-card img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover}
.mag-card .meta{padding:16px 20px 20px;display:grid;gap:4px}
.mag-card .kicker{font-size:13px;letter-spacing:.12em;color:var(--acc)}
.mag-card .t{font-family:var(--f-disp);font-size:24px;line-height:1.3}
.mag-card .d{color:var(--muted);font-size:15px}
.draft{margin-top:44px;background:var(--paper);border-radius:6px;padding-block:24px;padding-inline:clamp(16px,3vw,32px);border:1px dashed var(--shade)}
.draft h2{font-family:var(--f-disp);font-weight:normal;font-size:24px;margin:0 0 4px}
.draft .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px 32px;margin-top:16px}
.draft h3{font-family:var(--f-disp);font-weight:normal;font-size:18px;margin:0 0 6px;color:var(--acc)}
.draft ul{margin:0;padding-left:18px}
.draft li{margin:2px 0}
.draft .tag{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.draft a{color:inherit}

/* ---------- reader ---------- */
#reader{position:relative}
.stage{position:relative;height:calc(100dvh - var(--bar-h) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden;
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.spread{position:relative;display:flex;perspective:2200px}
.slot{position:relative;width:var(--pw);height:var(--ph)}
.two .slot.l{box-shadow:-10px 14px 30px -18px rgba(50,35,10,.5)}
.two .slot.r{box-shadow:10px 14px 30px -18px rgba(50,35,10,.5)}
.one .slot.l{display:none}
.one .slot.r{box-shadow:0 14px 30px -18px rgba(50,35,10,.5)}
.slot.empty{box-shadow:none!important}
.page{position:absolute;inset:0;background:var(--paper);display:flex;flex-direction:column;overflow:hidden;backface-visibility:hidden}
.two .slot.l .page,.two .leaf.l .page{background:linear-gradient(to left,rgba(60,40,10,.09),transparent 7%),var(--paper)}
.two .slot.r .page,.two .leaf.r .page{background:linear-gradient(to right,rgba(60,40,10,.09),transparent 7%),var(--paper)}
.pg-head{display:flex;justify-content:space-between;gap:8px;padding:14px 26px 0;font-size:12px;letter-spacing:.08em;color:var(--muted);white-space:nowrap;overflow:hidden}
.pg-head span:last-child{overflow:hidden;text-overflow:ellipsis}
.pg-body{flex:1;min-height:0;padding:10px 26px 0;overflow:hidden;display:flex;flex-direction:column;gap:12px}
.pg-body.tall{overflow-y:auto}
.pg-foot{padding:6px 26px 12px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.slot.l .pg-foot{text-align:left}.slot.r .pg-foot,.leaf .pg-foot{text-align:right}
.page.cover .pg-head,.page.cover .pg-foot{display:none}
.page.cover .pg-body{padding:0}
.page.cover{background:var(--tint)!important}.page.cover .pg-body{overflow-y:auto}.cover-img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.cover-txt{flex:1;display:flex;flex-direction:column;gap:10px;padding:28px 28px 24px}
.cover-k{font-size:13px;letter-spacing:.14em;color:var(--acc)}
.cover-t{font-family:var(--f-disp);font-size:clamp(30px,4.2vw,44px);line-height:1.2;color:var(--acc-ink);text-wrap:balance}
.cover-s{font-family:var(--f-disp);font-size:22px;color:var(--acc-ink)}
.cover-h{font-size:13px;letter-spacing:.12em;color:var(--acc);margin-top:8px}
.cover-l{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.cover-l li{border-top:1px solid color-mix(in srgb,var(--acc) 25%,transparent);padding-top:8px;font-size:16px}
.cover-i{margin-top:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted);border-top:1px solid color-mix(in srgb,var(--acc) 30%,transparent);padding-top:10px}
.leaf{position:absolute;top:0;width:var(--pw);height:var(--ph);transform-style:preserve-3d;z-index:5;pointer-events:none}
.leaf .page{box-shadow:0 0 40px rgba(40,25,5,.25)}
.nav{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.nav input{width:min(320px,48vw);accent-color:var(--acc)}
.turn{position:absolute;top:50%;transform:translateY(-50%);z-index:8;width:44px;height:64px;border:0;border-radius:10px;background:color-mix(in srgb,var(--paper) 80%,transparent);font-size:26px;color:var(--acc);box-shadow:0 2px 8px rgba(40,30,10,.12)}
.turn.prev{left:max(10px,env(safe-area-inset-left,0px))}.turn.next{right:max(10px,env(safe-area-inset-right,0px))}
.turn:disabled{opacity:.25;cursor:default}
.one .turn{top:auto;bottom:4px;transform:none;height:40px}

/* scroll mode */
#scroll{padding-block:0 80px}
.scroll-hero{display:block;width:100%;max-width:1100px;margin:0 auto;aspect-ratio:16/10;object-fit:cover}
.article{max-width:720px;margin:0 auto;padding-block:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;background:var(--paper)}
.scroll-wrap{background:var(--paper)}
.article h2{scroll-margin-top:calc(var(--bar-h) + 16px)}

/* ---------- content blocks ---------- */
.blk-title{font-family:var(--f-disp);font-size:30px;line-height:1.25;margin:4px 0 0;color:var(--acc-ink);text-wrap:balance}
.blk-sub{margin:0;color:var(--muted)}
.byline{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin:0}
h2.sec{font-family:var(--f-disp);font-weight:normal;font-size:23px;line-height:1.35;margin:6px 0 0;color:var(--acc-ink);text-wrap:balance}
h2.sec .no{display:block;font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;color:var(--acc)}
.pg-body p,.article p{margin:0}
.lede{font-size:17px}
ul.pts{margin:0;padding-left:20px;display:grid;gap:4px}
.box{background:var(--tint);border-radius:8px;padding:2px 14px}
.box summary{cursor:pointer;padding:8px 0;font-size:15px;color:var(--acc-ink)}
.box[open]{padding-bottom:12px}
.box p+p{margin-top:6px}
.formula{font-family:var(--f-mono);font-size:14px;background:var(--paper);border-radius:6px;padding:8px 10px;overflow-x:auto}
figure{margin:0}
figure img{display:block;width:100%;border-radius:6px;max-height:300px;object-fit:cover}
figcaption{font-size:13px;color:var(--muted);margin-top:6px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-weight:normal;color:var(--muted);font-size:13px}
.note{font-size:13px;color:var(--muted)}
.svgfig svg{width:100%;height:auto;display:block}

/* ---------- widgets ---------- */
.w{border:1.5px solid color-mix(in srgb,var(--acc) 45%,var(--line));border-radius:10px;padding:12px;background:var(--paper);display:flex;flex-direction:column;gap:10px}
.w-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.w-h .k{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:#fff;background:var(--acc);padding:2px 8px;border-radius:4px}
.w-h .t{font-family:var(--f-disp);font-size:18px}
.w canvas{display:block;width:100%;border-radius:6px;background:var(--tint);touch-action:none}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.row label{font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row input[type=range]{flex:1;min-width:120px;accent-color:var(--acc)}
.btn{border:1px solid color-mix(in srgb,var(--acc) 50%,var(--line));background:var(--paper);border-radius:8px;padding:4px 12px;font-size:14px}
.btn.on,.btn.primary{background:var(--acc);color:#fff;border-color:var(--acc)}
.stat{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.big{font-family:var(--f-disp);font-size:22px;color:var(--acc)}
.endcard{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:14px;margin-top:6px}
.msg{font-size:14px;min-height:3.2em;color:var(--acc-ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pad{display:grid;grid-template-columns:repeat(3,40px);grid-template-rows:repeat(3,34px);gap:4px}
.pad button{border:1px solid var(--line);background:var(--tint);border-radius:6px;font-size:16px}
.reclist{display:grid;gap:6px}
.reclist .r{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.reclist audio{height:32px;flex:1;min-width:180px}

/* ---------- toc drawer ---------- */
.toc{position:fixed;z-index:30;top:0;right:0;bottom:0;width:min(360px,92vw);background:var(--paper);box-shadow:-10px 0 40px rgba(40,30,10,.25);transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column;
  padding-top:calc(env(safe-area-inset-top,0px) + 16px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);padding-right:max(16px,env(safe-area-inset-right,0px));padding-left:20px}
.toc.open{transform:none}
.toc h2{font-family:var(--f-disp);font-weight:normal;font-size:22px;margin:0}
.toc .x{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 12px);border:0;background:none;font-size:24px}
.toc nav{overflow-y:auto;margin-top:12px;display:grid;gap:18px}
.toc .mg{display:grid;gap:2px}
.toc .mg-t{font-family:var(--f-disp);font-size:17px;color:var(--acc);border:0;background:none;text-align:left;padding:4px 0}
.toc .it{display:flex;gap:10px;align-items:baseline;border:0;background:none;text-align:left;padding:5px 0;font-size:15px;border-bottom:1px dotted var(--line)}
.toc .it span:first-child{flex:1}
.toc .it .pn{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.toc .it.w-it{font-size:13px;color:var(--muted);padding-left:12px}
.scrim{position:fixed;inset:0;z-index:25;background:rgba(30,25,15,.3);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.measure{position:absolute;left:-10000px;top:0;visibility:hidden}
@media (prefers-reduced-motion:reduce){.mag-card,.toc,.scrim{transition:none}}

.m-led{--acc:#4a3fc2; --acc2:#f2a516; --tint:#efedfa; --acc-ink:#241b63}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:baseline}
.w .btn[aria-pressed="true"]{background:var(--acc);color:#fff;border-color:var(--acc)}
.w .btn[aria-pressed="true"] .dot{box-shadow:0 0 0 2px #fff}
.endcard a.btn{text-decoration:none;color:inherit}
.endcard a.btn.primary{color:#fff}
.pullq{font-family:var(--f-disp);font-size:21px;line-height:1.45;color:var(--acc-ink);border-left:5px solid var(--acc2);padding:2px 0 2px 14px;margin:4px 0!important;text-wrap:balance}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fact{background:var(--tint);border-radius:10px;padding:12px 6px;text-align:center}
.fact b{display:block;background:none;font-family:var(--f-disp);font-weight:normal;font-size:clamp(22px,6vw,30px);line-height:1.1;color:var(--acc)}
.fact span{font-size:13px;color:var(--muted)}
.tonote{font-size:14px;line-height:1.6;background:var(--tint);border-radius:8px;padding:10px 14px;color:var(--acc-ink)}
.tonote a{color:var(--acc);font-weight:700}
.ibar{display:inline-block;height:10px;width:calc(var(--w) * .7px);border-radius:3px;background:var(--acc2);vertical-align:middle;margin-right:8px;opacity:.85}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.duo>div{background:var(--tint);border-radius:10px;padding:10px 12px}
.duo h4{font-family:var(--f-disp);font-weight:normal;font-size:17px;margin:0 0 2px;color:var(--acc-ink)}
.duo p{font-size:14px}
@media(max-width:480px){.duo{grid-template-columns:1fr}}
.shelf{grid-template-columns:repeat(auto-fill,minmax(280px,420px))}
.tocbtn.hub{text-decoration:none;color:inherit}
@media (max-width:560px){body.reading .tocbtn.hub{display:none}}
</style>
</head>
<body>


<header class="bar">
  <a class="tocbtn hub" href="./" aria-label="처음 화면으로">← 처음</a>
  <button class="brand" id="toHome" aria-label="서가로">철수세미 <span>온라인 잡지</span></button>
  <div class="now" id="nowTitle"></div>
  <button class="tocbtn" id="homeBtn" hidden>← 서가</button><button class="tocbtn" id="tocBtn" hidden>목차</button>
  <div class="seg" id="modeSeg" hidden role="group" aria-label="읽기 방식">
    <button id="mScroll" aria-pressed="true">스크롤</button><button id="mBook" aria-pressed="false">책 넘기기</button>
  </div>
</header>

<main id="home">
  <h1 class="home-h">이번 호, LED로 잰 플랑크 상수</h1>
  <p class="home-sub">철수세미 동아리의 탐구를 초등학생·중학생도 읽을 수 있게 풀어 쓴 온라인 잡지예요. 표지를 누르면 열려요.</p>

<template id="tpl-led">
<p class="blk-title">LED 속 미끄럼틀의 높이를 재는 법</p>
<p class="blk-sub">색깔마다 다른 빛 알갱이의 에너지로 플랑크 상수 구하기</p>
<p class="byline">철수세미 · 물리 · 박혁진</p>
<p class="tonote">이 기사는 어린이용이에요. 원데이터와 계산 과정까지 보고 싶으면 <a href="note.html">어른용 연구 노트</a>를 읽어 보세요.</p>

<h2 class="sec" data-toc><span class="no">01</span>파란 LED만 화면에 안 들어갔어요</h2>
<p class="lede">빨강, 노랑, 초록, 파랑 LED를 하나씩 멀티미터에 대 봤어요. 멀티미터의 ‘다이오드 모드’는 LED에 아주 작은 전류를 흘려 보고, 그때 LED에 걸린 전압을 보여 줘요. 그런데 파랑만 숫자가 안 나오고 ‘1’이 떴어요.</p>
<div class="svgfig" data-fig="meters"></div>
<p>이 멀티미터는 1.999 V까지만 보여 줄 수 있는데, 파랑은 그보다 높아서 화면을 넘어간 거예요. 빨강에서 파랑으로 갈수록 숫자가 커지는 것도 눈에 띄었어요.</p>
<p class="pullq">LED는 왜 색깔마다 켜지는 데 필요한 전압이 다를까요?</p>
<p>이 질문을 따라가다 보니 물리학에서 아주 유명한 숫자, <b>플랑크 상수</b>까지 가게 됐어요.</p>
<p class="note">다이오드 모드는 실제보다 0.5 V쯤 낮게 나와서, 본 실험에서는 색깔 순서만 참고했어요.</p>

<h2 class="sec" data-toc><span class="no">02</span>LED 속에는 미끄럼틀이 있어요</h2>
<p>빛은 아주 작은 알갱이들이 날아오는 거예요. 알갱이가 많으면 밝아지고, 알갱이 하나하나가 세지면 색이 빨강에서 파랑 쪽으로 바뀌어요.</p>
<div class="svgfig" data-fig="grains"></div>
<p>밝기를 아무리 올려도 알갱이 하나의 힘은 그대로예요. 알갱이 하나의 힘은 오직 색이 정해요. 이 힘(에너지)은 ‘전자볼트(eV)’라는 단위로 재는데, 그림처럼 빨간빛 알갱이는 약 2.0 eV, 파란빛 알갱이는 약 2.6 eV예요.</p>
<p>이제 LED 안에 <b>미끄럼틀</b>이 있다고 생각해 봐요. 전자가 미끄럼틀을 한 번 타고 내려올 때마다 빛 알갱이가 하나 나와요. 미끄럼틀이 높을수록 센 알갱이가 나오니까, 파란 LED의 미끄럼틀이 빨간 LED보다 높아요.</p>
<p>전자를 꼭대기까지 올려 주는 계단이 <b>전압</b>이에요. 계단이 미끄럼틀보다 낮으면 아무도 못 타서 불이 안 켜지고, 계단이 꼭대기에 닿는 순간 불이 켜지기 시작해요. 그때의 전압을 <b>문턱전압</b>이라고 해요.</p>
<div class="w" data-w="slide" data-name="LED 미끄럼틀"></div>
<p class="note">막대는 3.2 V까지만 있어요. 실제 실험에서 전원을 12 V까지 올려도 LED에 걸린 전압은 가장 높은 파랑도 2.84 V였고, 나머지 전압은 저항이 나눠 가졌거든요.</p>
<p class="pullq">문턱전압을 재면 미끄럼틀의 높이를 알 수 있어요. 전압계로 빛 알갱이의 에너지를 재는 셈이에요.</p>
<details class="box"><summary>더 알고 싶은 친구들을 위해 · 식으로 쓰면</summary>
<p class="formula">e × V₀ ≈ E = h × f = h × c ÷ λ</p>
<p>E는 빛 알갱이(광자) 하나의 에너지, f는 빛이 1초에 출렁이는 횟수(진동수), λ는 파장, c는 빛의 속력, V₀는 문턱전압, e는 전자 하나의 전하예요. h가 플랑크 상수(6.626 × 10⁻³⁴ J·s)예요.</p>
<p>1 eV는 전자 하나를 1 V로 밀어 올렸을 때 얻는 에너지예요. 파장을 nm 단위로 쓰면 E(eV) ≈ 1240 ÷ λ로 빠르게 계산할 수 있어요. 630 nm 빨간빛은 1240 ÷ 630 ≈ 1.97 eV예요.</p>
<p>미끄럼틀의 진짜 이름은 ‘띠 간격(밴드갭)’이에요. 실제 LED는 열 같은 이유로 이 식보다 조금 낮은 전압에서 켜지기 시작해요. 위 프로그램은 그 차이를 뺀 단순한 모형이에요.</p>

<p>전원, 저항, LED를 한 줄로 잇고 멀티미터로 두 곳을 쟀어요. ①은 계단의 높이이고, ②는 미끄럼틀을 타는 전자가 얼마나 많은지 알려 줘요.</p>
<div class="duo">
<div><h4>저항은 안전벨트</h4><p>LED는 문턱을 넘으면 전류가 갑자기 늘어요. 저항이 없으면 망가질 수 있어요.</p></div>

<details class="box"><summary>더 알고 싶은 친구들을 위해 · 왜 이렇게 했을까?</summary>
<p><b>전원장치 바늘은 안 믿었어요.</b> 바늘은 0.75 V까지 틀릴 수 있어요. 바늘을 3 V에 맞췄을 때 ①과 ②를 더하면 3.26 V였어요. 그래서 전압은 모두 멀티미터로 쟀어요.</p>
<p><b>전원은 3, 6, 8, 10, 12 V로 바꿨어요.</b> 문턱전압은 전류가 3 mA 넘게 흐르는 점으로 구하는데, 9 V 대신 8 V와 10 V를 넣으면 그런 점이 3개에서 4개로 늘어요.</p>
</details>

<h2 class="sec" data-toc><span class="no">04</span>손잡이를 돌려 보자</h2>
<p>전원 손잡이를 돌려 전압을 올리면서 빨강 LED의 ①과 ②를 쟀어요. 이상한 점이 보이나요?</p>
<div class="tbl"><table><thead><tr><th>전원 바늘</th><th>① LED 전압</th><th>② 전류</th></tr></thead><tbody>
<tr><td>3 V</td><td>1.81 V</td><td><span class="ibar" style="--w:14"></span>1.45 mA</td></tr>
<tr><td>6 V</td><td>1.88 V</td><td><span class="ibar" style="--w:44"></span>4.50 mA</td></tr>
<tr><td>8 V</td><td>1.91 V</td><td><span class="ibar" style="--w:62"></span>6.32 mA</td></tr>
<tr><td>10 V</td><td>1.94 V</td><td><span class="ibar" style="--w:82"></span>8.39 mA</td></tr>
<tr><td>12 V</td><td>1.96 V</td><td><span class="ibar" style="--w:100"></span>10.27 mA</td></tr></tbody></table></div>
<p>전원을 6 V에서 12 V로 올리는 동안 ①은 1.88 V에서 1.96 V로 겨우 0.08 V 올랐어요. 그런데 전류는 4.50 mA에서 10.27 mA로 두 배 넘게 늘었어요. 계단이 미끄럼틀을 넘고 나면, 조금만 더 높여도 전자가 우르르 몰려가는 거예요. 저항이 안전벨트 노릇을 해야 하는 이유도 이거예요.</p>
<p>나머지 LED도 모두 같았어요. 파랑은 ①이 2.68 V에서 2.84 V로 0.16 V 오르는 동안 전류가 3.65 mA에서 9.52 mA로 늘었어요.</p>

<h2 class="sec" data-toc><span class="no">05</span>이륙 지점 찾기</h2>
<p>불이 켜지기 시작하는 순간을 눈으로 정하면 사람마다 달라요. 밝은 교실에서는 늦게, 어두운 방에서는 일찍 켜진 것처럼 보이거든요.</p>
<p>그래서 비행기의 <b>이륙 지점</b>을 찾는 방법을 썼어요. 날아오르는 비행기의 길을 땅까지 거꾸로 이으면 어디서 떴는지 알 수 있죠. LED도 전류가 잘 흐르는 점들을 직선으로 이어서, 전류가 0이 되는 곳까지 늘려요. 거기가 문턱전압이에요.</p>
<div class="w" data-w="takeoff" data-name="이륙 지점 찾기"></div>
<p>이렇게 찾은 네 LED의 문턱전압이에요. 빨강에서 파랑으로 갈수록 커져요.</p>
<div class="tbl"><table><thead><tr><th>LED</th><th>문턱전압</th></tr></thead><tbody>
<tr><td><span class="dot" style="background:#e0453a"></span>빨강</td><td>1.82 V</td></tr>
<tr><td><span class="dot" style="background:#e3a400"></span>노랑</td><td>1.93 V</td></tr>
<tr><td><span class="dot" style="background:#79b52d"></span>초록</td><td>1.95 V</td></tr>
<tr><td><span class="dot" style="background:#2f6fe0"></span>파랑</td><td>2.58 V</td></tr></tbody></table></div>
<div class="svgfig" data-fig="slides"></div>
<p>네 LED의 문턱전압은 미끄럼틀 높이보다 조금씩 낮게 나왔어요. 실제 LED는 꼭대기에 닿기 조금 전부터 켜지기 시작하거든요. 그런데 초록만 유독 많이 모자라요. 이 수수께끼는 07에서 풀어요.</p>
<details class="box"><summary>더 알고 싶은 친구들을 위해 · 직선은 어떻게 긋나요?</summary>
<p>점들과 직선 사이의 세로 거리를 각각 제곱해서 모두 더한 값이 가장 작아지는 직선을 골라요. 이 방법을 ‘최소제곱법’이라고 해요. 전원 3 V 점은 전류가 작아 그래프가 휘어지는 구간이라 빼고, 6~12 V의 네 점으로 직선을 그었어요. 네 점은 모두 직선에서 0.005 V 안쪽에 있었어요.</p>
</details>

<h2 class="sec" data-toc><span class="no">06</span>플랑크 상수는 빛의 ‘환율’</h2>
<p>빛의 색은 1초에 몇 번 출렁이는지(진동수)로도 나타낼 수 있어요. 빨간빛은 1초에 약 476조 번, 파란빛은 약 638조 번 출렁여요. 플랑크 상수는 이 진동수를 에너지로 바꿔 주는 <b>환율</b>이에요. 달러에 환율을 곱하면 원이 되듯, 진동수에 플랑크 상수를 곱하면 빛 알갱이의 에너지가 돼요.</p>
<p>다만 문턱전압에는 모든 LED에 똑같이 붙는 차이가 섞여 있어요. 택시의 <b>기본요금</b> 같은 거예요. 영수증 두 장을 비교하면 기본요금을 몰라도 1 km당 요금을 알 수 있죠. 그래프에서는 직선의 기울기예요.</p>
<div class="svgfig" data-fig="taxi"></div>
<p>LED도 똑같아요. 여러 색의 문턱전압을 진동수에 맞춰 점으로 찍고 직선을 그으면, 그 기울기가 플랑크 상수를 알려 줘요.</p>
<div class="facts">
<div class="fact"><b>7.81</b><span>우리가 구한 값</span></div>
<div class="fact"><b>6.626</b><span>정답</span></div>
<div class="fact"><b>+18%</b><span>차이</span></div>
</div>
<p class="note">단위는 × 10⁻³⁴ J·s예요.</p>
<p>18%나 차이 나지만, 플랑크 상수는 소수점 아래로 0이 33개나 붙는 아주 작은 숫자예요. 학교 장비로 그 자릿수까지는 맞힌 거예요. 18%가 어디서 왔는지는 07과 08에서 따라가 봐요.</p>
<details class="box"><summary>더 알고 싶은 친구들을 위해 · 기울기에서 h로</summary>
<p class="formula">문턱전압 = (h ÷ e) × 진동수 − (공통 차이)<br>h = e × 기울기</p>
<p>진동수를 10¹⁴ Hz 단위로 그리면 기울기가 0.4875 V였어요. h = 1.602 × 10⁻¹⁹ × 0.4875 ÷ 10¹⁴ ≈ 7.81 × 10⁻³⁴ J·s예요. 정답이라면 기울기가 0.4136 V여야 해요.</p>
</details>

<h2 class="sec" data-toc><span class="no">07</span>초록 LED 미스터리</h2>
<p>사실 처음 계산한 값은 6.96으로, 정답과 겨우 5% 차이였어요. 초록 LED를 흔히 쓰는 525 nm짜리라고 생각하고 계산했거든요.</p>
<p>그런데 이상했어요. 525 nm 빛 알갱이의 에너지는 2.36 eV인데 초록의 문턱전압은 1.95 V였어요. 계단이 미끄럼틀보다 0.4 V나 낮은데 불이 켜진 셈이에요. 다른 LED는 0.06~0.17 V만 낮았어요.</p>

<p>이틀 뒤 다시 재도 1.943 V로, 처음과 0.002 V밖에 차이 나지 않았어요. 이 LED는 이름만 초록이고 사실은 <b>연두색(약 570 nm)</b> LED였던 거예요. 아래에서 이름표를 바꿔 보세요.</p>
<div class="w" data-w="green" data-name="초록 LED 이름표 바꾸기"></div>
<p>이름표를 고치자 값은 7.81로, 정답에서 더 멀어졌어요. 그럼 처음의 5%는 뭐였을까요? 시험에서 실수를 두 번 했는데 답이 맞은 것과 같아요. 틀린 이름표와, 아래에 나올 파랑 쪽의 차이가 서로 반대 방향이라 우연히 지워졌던 거예요.</p>
<p class="pullq">답이 맞았다고 꼭 맞게 푼 건 아니에요.</p>

<p>이 상자의 초록은 파랑과 같은 줄에 있어요. 재 보니 문턱전압이 2.42 V로, 연두색 LED보다 0.47 V나 높았어요. 이쪽이 진짜 진초록(525 nm)이었던 거죠. 상자의 빨강, 노랑, 파랑은 처음 LED와 0.002~0.014 V밖에 차이 나지 않았어요. 다른 상자의 LED로 다시 재도 같은 값이 나왔으니, 측정은 잘 된 거예요.</p>
<div class="svgfig" data-fig="two"></div>
<p>그리고 비밀이 하나 더 나왔어요. LED가 두 묶음으로 나뉘었어요. 2 V대 LED(빨강, 노랑, 연두)는 문턱전압이 빛 알갱이 에너지보다 8~11% 낮았고, 3 V대 LED(파랑, 진초록)는 3% 안쪽으로 딱 맞았어요. 만드는 재료가 서로 달라서 그래요.</p>
<p>택시로 치면 <b>기본요금이 다른 두 회사</b>예요. 가까운 곳은 A 회사, 먼 곳은 B 회사 영수증으로 1 km당 요금을 계산하면 엉뚱한 값이 나오겠죠. 우리 직선도 그래서 너무 가팔라졌고, 플랑크 상수가 18% 크게 나왔어요.</p>
<p>한 회사 영수증만 쓰면 될 것 같지만, 묶음 안에서는 색깔 범위가 좁아서 이번엔 값이 너무 작게 나왔어요. 정확하게 구하려면 재료가 같으면서 색이 넓게 퍼진 LED가 필요해요.</p>
<details class="box"><summary>더 알고 싶은 친구들을 위해 · 두 묶음의 재료</summary>
<p>빨강·노랑·연두 LED는 보통 AlGaInP(알루미늄·갈륨·인듐·인), 파랑·진초록·흰색 LED는 InGaN(인듐·갈륨·질소) 재료로 만들어요. 흰색 LED(2.64 V)는 파란빛 칩에 노란 형광 물질을 칠한 거라 파랑과 비슷하게 나왔어요. 재료는 직접 확인하지 못했고, 상자 표기와 잰 전압으로 짐작했어요.</p>
</details>

<h2 class="sec" data-toc><span class="no">09</span>실험이 알려준 것</h2>
<ul class="pts">
<li><b>답이 맞아 보여도 의심해 봐요.</b> 5%라는 좋은 결과는 두 실수가 겹친 우연이었어요.</li>
<li><b>이름표도 확인해 봐요.</b> ‘초록’이라는 이름만 믿었다가 다른 LED를 쓰고 있었어요.</li>
<li><b>눈금이 전부가 아니에요.</b> 멀티미터는 0.01 V까지 읽었지만, 결과를 흔든 건 LED의 파장과 재료였어요.</li>
</ul>
<p>다음에는 CD에 LED 빛을 비추면 생기는 무지개를 이용해서, LED의 파장을 직접 재 보려고 해요. 집에 있는 LED 손전등과 리모컨 속에도 저마다의 미끄럼틀이 숨어 있어요.</p>

function canvasIn(host,ratio){
  const c=el('canvas');c.style.aspectRatio=ratio;host.appendChild(c);
  const st={c,ctx:c.getContext('2d'),w:0,h:0,draw:null};CANV.push(st);
  new ResizeObserver(()=>{const r=c.getBoundingClientRect();if(r.width<10)return;const d=Math.min(2,devicePixelRatio||1);
    const W=Math.round(r.width*d),H=Math.round(r.height*d);if(c.width===W&&c.height===H)return;
    c.width=W;c.height=H;st.ctx.setTransform(d,0,0,d,0,0);st.w=r.width;st.h=r.height;st.draw&&st.draw()}).observe(c);
  return st;
}

const NARROW=()=>innerWidth<560;
function lsq(xs,ys){const n=xs.length,mx=xs.reduce((a,b)=>a+b,0)/n,my=ys.reduce((a,b)=>a+b,0)/n;let sxy=0,sxx=0;for(let i=0;i<n;i++){sxy+=(xs[i]-mx)*(ys[i]-my);sxx+=(xs[i]-mx)**2}const a=sxy/sxx;return{a,b:my-a*mx,mx,my}}
function ledV0(L){const u=L.d.filter(p=>p[0]>=6);const f=lsq(u.map(p=>p[1]),u.map(p=>p[2]));return{v0:-f.b/f.a,a:f.a,b:f.b}}
const fq=lam=>LC0/(lam*1e-9)/1e14;           // 진동수, 10^14 Hz 단위
const slopeToH=s=>s*1e-14*LQ/1e-34;          // 기울기(V per 10^14 Hz) → h (×10^-34 J·s)
const STD_SLOPE=LH0/LQ*1e14;                  // 0.4136
function hpct(h){const e=(h*1e-34-LH0)/LH0*100;return (e>=0?'+':'−')+Math.abs(e).toFixed(0)+'%'}
function wl2rgb(nm){let r=0,g=0,b=0;if(nm<440){r=-(nm-440)/40;b=1}else if(nm<490){g=(nm-440)/50;b=1}else if(nm<510){g=1;b=-(nm-510)/20}else if(nm<580){r=(nm-510)/70;g=1}else if(nm<645){r=1;g=-(nm-645)/65}else{r=1}
  let f=nm<420?.3+.7*(nm-380)/40:nm>680?.3+.7*(720-nm)/40:1;const c=v=>Math.round(255*Math.pow(Math.max(0,v)*f,.8));return`rgb(${c(r)},${c(g)},${c(b)})`}
function ledBtns(list,onPick,init){const row=el('div',{class:'row'});let cur=init;
  list.forEach(L=>{const b=el('button',{class:'btn led-b','aria-pressed':String(L===init)},`<span class="dot" style="background:${L.col}"></span>${L.label||L.n}`);b.onclick=()=>{cur=L;row.querySelectorAll('.led-b').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));onPick(L)};row.appendChild(b)});return row}
function axes(ctx,X,Y,o){const {x0,x1,y0,y1,xs,ys,xl,yl,P,w,h}=o;ctx.save();ctx.strokeStyle=P.line;ctx.lineWidth=1;ctx.fillStyle=P.muted;ctx.font='11px '+css(document.body,'--f-mono');
  for(let v=xs[0];v<=x1+1e-9;v+=xs[1]){if(v<x0-1e-9)continue;ctx.beginPath();ctx.moveTo(X(v),Y(y0));ctx.lineTo(X(v),Y(y1));ctx.stroke();ctx.textAlign='center';ctx.fillText(+v.toFixed(2),X(v),Y(y0)+14)}
  for(let v=ys[0];v<=y1+1e-9;v+=ys[1]){if(v<y0-1e-9)continue;ctx.beginPath();ctx.moveTo(X(x0),Y(v));ctx.lineTo(X(x1),Y(v));ctx.stroke();ctx.textAlign='right';ctx.fillText(+v.toFixed(2),X(x0)-5,Y(v)+4)}
  ctx.fillStyle=P.ink;ctx.font='12px '+css(document.body,'--f-body');ctx.textAlign='right';ctx.fillText(xl,X(x1),Y(y0)+28);ctx.textAlign='left';ctx.fillText(yl,X(x0)-30,Y(y1)-8);ctx.restore()}

/* ---- 02 LED 미끄럼틀 (모형) ---- */
WID.slide=w=>{
  head(w,'모형','LED 미끄럼틀');
  const LEDS=[{n:'빨강',col:LEDCOL.r,lam:630},{n:'노랑',col:LEDCOL.y,lam:590},{n:'초록',col:'#2fb34a',lam:525},{n:'파랑',col:LEDCOL.b,lam:470}];
  let cur=LEDS[0],kids=[],phs=[],acc=0,last=0,glow=0,count=0,auto=false;
  w.appendChild(ledBtns(LEDS,L=>{cur=L;kids=[];phs=[];count=0;setAuto(false);upd()},cur));
  const cv=canvasIn(w,NARROW()?'16/11.5':'16/9');
  const ctl=el('div',{class:'row'},`<label>계단 높이 = LED에 걸린 전압 <input type="range" min="0" max="3.2" step="0.01" value="1.20"></label><span class="stat" data-v></span><button class="btn" data-auto>▶ 천천히 올리기</button>`);w.appendChild(ctl);
  const out=el('div',{class:'grid2'},`<div><div class="note">미끄럼틀 높이</div><div class="big" data-e>-</div></div><div><div class="note">나온 빛 알갱이</div><div class="big" data-c>0개</div></div>`);w.appendChild(out);
  const msg=el('div',{class:'msg'});w.appendChild(msg);
  const V=ctl.querySelector('input'),AB=ctl.querySelector('[data-auto]');
  const Eg=()=>1239.84/cur.lam;
  function setAuto(on){auto=on;AB.textContent=on?'■ 멈추기':'▶ 천천히 올리기';AB.setAttribute('aria-pressed',String(on))}
  AB.onclick=()=>{if(!auto){V.value=Math.max(0.6,Eg()-1.1).toFixed(2);count=0;kids=[];phs=[]}setAuto(!auto);upd()};
  function upd(){const v=+V.value,e=Eg();ctl.querySelector('[data-v]').textContent=v.toFixed(2)+' V';out.querySelector('[data-e]').textContent=e.toFixed(2)+' eV';
    if(v<e-0.005)msg.textContent=`계단(${v.toFixed(2)} V)이 미끄럼틀(${e.toFixed(2)} eV)보다 낮아요. 전자가 꼭대기에 못 올라가서 불이 안 켜져요.`;
    else if(v<e+0.08)msg.textContent=`계단이 꼭대기에 닿았어요. 지금 전압이 ${cur.n} LED의 문턱전압이에요.`;
    else msg.textContent='계단이 더 높아지니 전자가 줄줄이 미끄럼을 타요. 빛 알갱이가 많아져서 더 밝아지지만, 알갱이 하나의 힘(색)은 그대로예요.'}
  V.oninput=()=>{setAuto(false);upd()};upd();
  const geo=()=>{const W=cv.w,H=cv.h,g=H-30,sc=(g-40)/3.2;return{W,H,g,sc,yv:g-(+V.value)*sc,ye:g-Eg()*sc,sx0:14,sx1:W*.30,px:W*.39,pw:Math.max(26,W*.075),ex:W*.76}};
  const bez=(G,p)=>{const u=1-p,x0=G.px+G.pw,y0=G.ye,x1=x0+(G.ex-x0)*.45,y1=G.ye,x2=G.ex-50,y2=G.g-5,x3=G.ex,y3=G.g-5;return[u*u*u*x0+3*u*u*p*x1+3*u*p*p*x2+p*p*p*x3,u*u*u*y0+3*u*u*p*y1+3*u*p*p*y2+p*p*p*y3]};
  cv.draw=()=>{const {ctx}=cv;const P=pal(w);const G=geo();const {W,H,g}=G;ctx.clearRect(0,0,W,H);const fb=css(document.body,'--f-body'),fd=css(document.body,'--f-disp');
    ctx.fillStyle=P.line;ctx.fillRect(0,g,W,3);
    // 계단(전압)
    const n=7,sh=(g-G.yv)/n,sw=(G.sx1-G.sx0)/n;ctx.fillStyle=css(w,'--acc');ctx.globalAlpha=.85;for(let i=0;i<n;i++)ctx.fillRect(G.sx0+sw*i,g-sh*(i+1),sw+1,sh*(i+1));
    ctx.fillRect(G.sx1,G.yv,G.px-G.sx1,Math.min(6,g-G.yv));ctx.globalAlpha=1;
    // 미끄럼틀 기둥과 면
    ctx.fillStyle=cur.col;ctx.globalAlpha=.25;ctx.fillRect(G.px,G.ye,G.pw,g-G.ye);ctx.globalAlpha=1;ctx.fillRect(G.px-3,G.ye-4,G.pw+6,7);
    ctx.strokeStyle=cur.col;ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();const b0=bez(G,0);ctx.moveTo(b0[0],b0[1]);for(let p=.04;p<=1.001;p+=.04){const q=bez(G,p);ctx.lineTo(q[0],q[1])}ctx.stroke();ctx.lineWidth=1;ctx.lineCap='butt';
    // 높이 표시
    ctx.setLineDash([4,4]);ctx.strokeStyle=P.muted;ctx.beginPath();ctx.moveTo(G.sx0,G.ye);ctx.lineTo(G.px,G.ye);ctx.stroke();ctx.setLineDash([]);
    ctx.font='15px '+fd;
    ctx.fillStyle=css(w,'--acc');ctx.textAlign='left';if(+V.value>0.12)ctx.fillText((+V.value).toFixed(2)+' V',G.sx0+2,Math.max(16,G.yv-8));
    ctx.font='12px '+fb;ctx.fillStyle=P.ink;ctx.textAlign='center';ctx.fillText('계단 = 전압',(G.sx0+G.sx1)/2,g+19);ctx.textAlign='left';ctx.fillText('미끄럼틀 높이 '+Eg().toFixed(2)+' eV',G.px-4,g+19);ctx.textAlign='center';
    // LED
    const lx=W-48,ly=54,gl=Math.min(1,glow);ctx.fillStyle=cur.col;
    if(gl>.03){ctx.globalAlpha=gl*.28;ctx.beginPath();ctx.arc(lx,ly,20+26*gl,0,7);ctx.fill()}
    ctx.globalAlpha=.18+.82*gl;ctx.beginPath();ctx.arc(lx,ly,18,Math.PI,0);ctx.lineTo(lx+18,ly+20);ctx.lineTo(lx-18,ly+20);ctx.fill();ctx.globalAlpha=1;
    ctx.fillStyle=P.muted;ctx.fillRect(lx-10,ly+20,4,18);ctx.fillRect(lx+6,ly+20,4,18);ctx.fillStyle=P.ink;ctx.fillText(gl>.08?'켜짐':'꺼짐',lx,ly+56);
    // 빛 알갱이
    phs.forEach(p=>{ctx.strokeStyle=cur.col;ctx.lineWidth=2;ctx.globalAlpha=.55;ctx.beginPath();const wl=cur.lam/630*13;for(let k=0;k<26;k++){const d=6+k*1.5,o=Math.sin(d/wl*6.283)*4;const x=p.x-p.ux*d-p.uy*o,y=p.y-p.uy*d+p.ux*o;k?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();ctx.globalAlpha=1;ctx.lineWidth=1;
      ctx.fillStyle=cur.col;ctx.beginPath();ctx.arc(p.x,p.y,6,0,7);ctx.fill();ctx.fillStyle='rgba(255,255,255,.75)';ctx.beginPath();ctx.arc(p.x-2,p.y-2,2,0,7);ctx.fill()});
    // 전자
    kids.forEach(k=>{ctx.globalAlpha=k.a;ctx.fillStyle=P.ink;ctx.beginPath();ctx.arc(k.x,k.y,6.5,0,7);ctx.fill();ctx.strokeStyle=P.paper;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(k.x-3,k.y);ctx.lineTo(k.x+3,k.y);ctx.stroke();ctx.lineWidth=1;ctx.globalAlpha=1});
  };
  const tick=t=>{if(!visible(cv.c)){last=t;return}const dt=Math.min(.05,(t-(last||t))/1000);last=t;const G=geo();const {W,g}=G;
    if(auto){const nv=+V.value+dt*0.22;if(nv>=Eg()+0.3){V.value=(Eg()+0.3).toFixed(2);setAuto(false)}else V.value=nv.toFixed(3);upd()}
    const v=+V.value,e=Eg(),ok=v>=e-0.005,rate=ok?Math.min(7,1.4+(v-e)*22):1.1;
    acc+=dt*rate;while(acc>1){acc--;kids.push({x:G.sx0,y:g-7,st:'up',a:1})}
    let done=0;const sp=dt*W*.26;
    kids.forEach(k=>{
      if(k.st==='up'){k.x+=sp;k.y=g-7-(g-G.yv)*Math.min(1,(k.x-G.sx0)/(G.sx1-G.sx0));if(k.x>=G.sx1){k.st='walk'}}
      else if(k.st==='walk'){k.x+=sp;k.y=G.yv-7;if(k.x>=G.px-7){if(ok){k.st='plat'}else{k.st='back'}}}
      else if(k.st==='plat'){k.x+=sp;k.y+=(G.ye-11-k.y)*Math.min(1,dt*14);if(k.x>=G.px+G.pw){k.st='slide';k.p=0}}
      else if(k.st==='slide'){k.p+=dt*1.5;const q=bez(G,Math.min(1,k.p));k.x=q[0];k.y=q[1]-9;if(k.p>=1){k.st='out';done++;const ang=-0.62;phs.push({x:k.x+6,y:k.y-4,ux:Math.cos(ang),uy:Math.sin(ang)})}}
      else if(k.st==='back'){k.x-=sp*.8;k.y=G.yv-7;k.a-=dt*1.4}
      else if(k.st==='out'){k.x+=sp*.6;k.a-=dt*1.6}});
    kids=kids.filter(k=>k.a>0);
    if(done){count+=done;out.querySelector('[data-c]').textContent=count+'개'}
    phs.forEach(p=>{p.x+=p.ux*dt*W*.42;p.y+=p.uy*dt*W*.42});phs=phs.filter(p=>p.x<W+50&&p.y>-50);
    glow+=((ok?Math.min(1,rate/5):0)-glow)*Math.min(1,dt*3);cv.draw()};
  TICKERS.add(tick);
};

/* ---- 04 이륙 지점 찾기 (실측) ---- */
WID.takeoff=w=>{
  head(w,'실제 측정값','이륙 지점 찾기');
  const LIST=[...LED_OLD.map(L=>({...L,label:L.n})),{...LED_KIT[2],label:'키트 초록'}];
  let cur=LIST[0],ans=false,hA,hB;
  function reset(){const f=ledV0(cur);const V=i=>(i-f.b)/f.a;hA=V(2)-0.025;hB=V(10)+0.02;ans=false;showB.textContent='컴퓨터 답 보기';upd()}
  w.appendChild(ledBtns(LIST,L=>{cur=L;reset()},cur));
  const cv=canvasIn(w,NARROW()?'4/3.15':'16/10');
  const row=el('div',{class:'row'},`<button class="btn" data-ans>컴퓨터 답 보기</button><button class="btn" data-re>다시</button><span class="note">동그라미 손잡이 두 개를 좌우로 끌어 직선을 맞춰 보세요.</span>`);w.appendChild(row);
  const showB=row.querySelector('[data-ans]');showB.onclick=()=>{ans=!ans;showB.textContent=ans?'답 숨기기':'컴퓨터 답 보기';upd()};row.querySelector('[data-re]').onclick=reset;
  const out=el('div',{class:'grid2'},`<div><div class="note">내가 찾은 이륙 지점</div><div class="big" data-me>-</div></div><div><div class="note">컴퓨터가 찾은 문턱전압</div><div class="big" data-pc>?</div></div>`);w.appendChild(out);
  const msg=el('div',{class:'msg'});w.appendChild(msg);
  const geo=()=>{const xs=cur.d.map(q=>q[1]);const f=ledV0(cur);const x0=Math.min(f.v0,...xs)-0.06,x1=Math.max(...xs)+0.03;const L=46,R=cv.w-12,T=16,B=cv.h-34;return{x0,x1,X:v=>L+(v-x0)/(x1-x0)*(R-L),iX:px=>x0+(px-L)/(R-L)*(x1-x0),Y:i=>B-i/11*(B-T),L,R,T,B}};
  const myV0=()=>{const a=(10-2)/(hB-hA);return hA-2/a};
  function upd(){const f=ledV0(cur),m=myV0();out.querySelector('[data-me]').textContent=isFinite(m)?m.toFixed(3)+' V':'-';out.querySelector('[data-pc]').textContent=ans?f.v0.toFixed(3)+' V':'?';
    const d=Math.abs(m-f.v0);msg.textContent=!isFinite(m)?'':ans?`차이는 ${(d*1000).toFixed(0)} mV예요. `+(d<0.01?'거의 똑같이 맞혔어요!':d<0.03?'아주 가까워요.':'꽉 찬 점 네 개를 직선이 지나가게 다시 맞춰 보세요.'):'꽉 찬 점 네 개(전류 3 mA 넘는 점)를 따라 직선을 맞춰 보세요. 빈 점은 휘어지는 구간이라 빼요.';cv.draw&&cv.draw()}
  cv.draw=()=>{if(hA===undefined)return;const {ctx}=cv;const P=pal(w);const G=geo();ctx.clearRect(0,0,cv.w,cv.h);
    const xs0=Math.ceil(G.x0*20)/20;axes(ctx,G.X,G.Y,{x0:G.x0,x1:G.x1,y0:0,y1:11,xs:[xs0,0.05],ys:[0,2],xl:'LED 전압 ① (V)',yl:'전류 (mA)',P});
    ctx.strokeStyle=P.muted;ctx.setLineDash([2,4]);ctx.beginPath();ctx.moveTo(G.X(G.x0),G.Y(3));ctx.lineTo(G.X(G.x1),G.Y(3));ctx.stroke();ctx.setLineDash([]);ctx.strokeStyle=P.ink;ctx.lineWidth=3;ctx.setLineDash([14,8]);ctx.beginPath();ctx.moveTo(G.X(G.x0),G.Y(0));ctx.lineTo(G.X(G.x1),G.Y(0));ctx.stroke();ctx.setLineDash([]);ctx.lineWidth=1;
    cur.d.forEach(q=>{ctx.strokeStyle=cur.col;ctx.fillStyle=q[0]>=6?cur.col:P.paper;ctx.lineWidth=2;ctx.beginPath();ctx.arc(G.X(q[1]),G.Y(q[2]),5,0,7);ctx.fill();ctx.stroke();ctx.lineWidth=1});
    if(ans){const f=ledV0(cur);ctx.strokeStyle=P.muted;ctx.setLineDash([6,4]);ctx.beginPath();ctx.moveTo(G.X(f.v0),G.Y(0));ctx.lineTo(G.X((10.8-f.b)/f.a),G.Y(10.8));ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle=P.muted;ctx.beginPath();ctx.arc(G.X(f.v0),G.Y(0),5,0,7);ctx.fill()}
    const a=(10-2)/(hB-hA),m=myV0(),top=hA+(10.8-2)/a;
    ctx.strokeStyle=css(w,'--acc');ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(G.X(m),G.Y(0));ctx.lineTo(G.X(top),G.Y(10.8));ctx.stroke();ctx.lineWidth=1;

    ctx.fillStyle=css(w,'--acc2');ctx.beginPath();ctx.moveTo(G.X(m),G.Y(0)-2);ctx.lineTo(G.X(m)-7,G.Y(0)+10);ctx.lineTo(G.X(m)+7,G.Y(0)+10);ctx.fill();

/* ---- 그래프 공통: 문턱전압–진동수 ---- */
function fvPlot(cv,w,pts,o){const {ctx}=cv;const P=pal(w);ctx.clearRect(0,0,cv.w,cv.h);
  const x0=4.4,x1=6.6,y0=o.y0||1.6,y1=o.y1||2.8,L=44,R=cv.w-12,T=18,B=cv.h-34;const X=v=>L+(v-x0)/(x1-x0)*(R-L),Y=v=>B-(v-y0)/(y1-y0)*(B-T);
  axes(ctx,X,Y,{x0,x1,y0,y1,xs:[4.5,0.5],ys:[Math.ceil(y0*5)/5,0.2],xl:'진동수 (×10¹⁴ Hz)',yl:'문턱전압 (V)',P});
  if(o.theory){ctx.strokeStyle=P.muted;ctx.setLineDash([3,4]);ctx.beginPath();ctx.moveTo(X(x0),Y(STD_SLOPE*x0));ctx.lineTo(X(x1),Y(STD_SLOPE*x1));ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=P.muted;ctx.font='11px '+css(document.body,'--f-body');ctx.textAlign='center';ctx.fillText('빛 알갱이 에너지와 같은 선',X(5.45),Y(STD_SLOPE*5.45)-9)}
  if(o.line){const {s,b}=o.line;ctx.strokeStyle=o.lineCol||css(w,'--acc');ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(X(x0),Y(s*x0+b));ctx.lineTo(X(x1),Y(s*x1+b));ctx.stroke();ctx.lineWidth=1}
  if(o.gaps){pts.forEach(p=>{ctx.strokeStyle=p.col;ctx.globalAlpha=.6;ctx.setLineDash([2,3]);ctx.beginPath();ctx.moveTo(X(p.f),Y(p.v));ctx.lineTo(X(p.f),Y(STD_SLOPE*p.f));ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1})}
  pts.forEach(p=>{ctx.fillStyle=p.hollow?P.paper:p.col;ctx.strokeStyle=p.col;ctx.lineWidth=2;ctx.beginPath();if(p.sq)ctx.rect(X(p.f)-5.5,Y(p.v)-5.5,11,11);else ctx.arc(X(p.f),Y(p.v),6,0,7);ctx.fill();ctx.stroke();ctx.lineWidth=1;
    if(p.lab){ctx.fillStyle=P.ink;ctx.font='11px '+css(document.body,'--f-body');ctx.textAlign=p.la||'center';ctx.fillText(p.lab,X(p.f)+(p.dx||0),Y(p.v)+(p.dy||18))}})}
const OLDPTS=()=>LED_OLD.map(L=>({f:fq(L.lam),v:ledV0(L).v0,col:L.col,n:L.n}));

WID.green=w=>{
  head(w,'실제 측정값','초록 LED 이름표 바꾸기');
  const cv=canvasIn(w,NARROW()?'4/3.15':'16/10');
  const ctl=el('div',{class:'row'},`<label>초록 LED의 파장 <input type="range" min="515" max="585" step="1" value="525"></label><span class="stat" data-l></span><button class="btn" data-p="525">525 nm · 처음 생각</button><button class="btn" data-p="570">570 nm · 연두</button>`);w.appendChild(ctl);
  const out=el('div',{class:'grid2'},`<div><div class="note">구한 플랑크 상수 (×10⁻³⁴ J·s)</div><div class="big" data-h>-</div></div><div><div class="note">초록: 빛 알갱이 에너지 − 문턱전압</div><div class="big" data-g>-</div></div>`);w.appendChild(out);
  const msg=el('div',{class:'msg'});w.appendChild(msg);
  const S=ctl.querySelector('input');const base=OLDPTS();
  function upd(){const lam=+S.value;ctl.querySelector('[data-l]').textContent=lam+' nm';
    const LP=[{la:'left',dx:11,dy:16},{la:'right',dx:-9,dy:-8},{la:'left',dx:9,dy:20},{la:'right',dx:-8,dy:-10}];
    const pts=base.map((p,i)=>i===2?{...p,f:fq(lam),lab:'초록 '+lam+' nm',...LP[2]}:{...p,lab:p.n,...LP[i]});const f=lsq(pts.map(p=>p.f),pts.map(p=>p.v));const h=slopeToH(f.a);
    const gap=1239.84/lam-pts[2].v;out.querySelector('[data-h]').textContent=h.toFixed(2)+'  ('+hpct(h)+')';out.querySelector('[data-g]').textContent=gap.toFixed(2)+' eV';
    msg.textContent=gap>0.3?`이 파장이라면 빛 알갱이 에너지가 문턱전압보다 ${gap.toFixed(2)} eV나 커요. 다른 LED(0.06~0.17)보다 훨씬 커서 말이 안 돼요. h는 정답에 가까워 보여도 믿을 수 없어요.`:gap>0.2?'차이가 아직 다른 LED보다 커요.':'이제 초록의 차이가 다른 LED들과 비슷해졌어요. 대신 h는 정답에서 멀어졌어요. 이쪽이 더 말이 되는 설명이에요.';
    cv.draw=()=>fvPlot(cv,w,pts,{line:{s:f.a,b:f.b},theory:true,gaps:true});cv.draw()}
  S.oninput=upd;ctl.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{S.value=b.dataset.p;upd()});upd();
};

const BUILT={};
function build(id){if(BUILT[id])return BUILT[id];const M=MAGS[id];const frag=document.getElementById(M.tpl).content.cloneNode(true);
  const blocks=[...frag.children];const holder=el('div',{class:M.cls});document.getElementById('measure').appendChild(holder);
  blocks.forEach(b=>{holder.appendChild(b);if(b.dataset.w&&WID[b.dataset.w])WID[b.dataset.w](b);if(b.dataset.fig)b.innerHTML=FIG[b.dataset.fig];if(b.dataset.end){const o=MAGS[b.dataset.end];b.innerHTML=`<span class="note">다 읽었어요!</span><button class="btn primary" data-goto="${b.dataset.end}">다음 잡지 · ${o.title}</button><button class="btn" data-goto="">서가로 돌아가기</button>`;b.querySelectorAll('[data-goto]').forEach(x=>x.onclick=()=>goHome(x.dataset.goto))}});
  let sec='';blocks.forEach(b=>{if(b.matches('h2.sec')){sec=b.textContent.replace(/^\d+/,'').trim()}b._sec=sec});
  holder.remove();holder.querySelectorAll('img').forEach(im=>{if(!im.complete)im.addEventListener('load',()=>{if(R.id===id&&R.mode==='book'){clearTimeout(rt);rt=setTimeout(()=>layout(true),80)}},{once:true})});return BUILT[id]={blocks,M}}

const R={id:null,mode:'book',pages:[],spread:0,two:false};
const reader=$('#reader'),book=$('#book'),slotL=$('#slotL'),slotR=$('#slotR'),spreadEl=$('#spread');

function mkPage(M,cover){const pg=el('div',{class:'page'+(cover?' cover':'')});const h=el('div',{class:'pg-head'});h.innerHTML=`<span>철수세미 · ${M.kicker}</span><span></span>`;const body=el('div',{class:'pg-body'});const f=el('div',{class:'pg-foot'});pg.append(h,body,f);return{el:pg,body,head:h,foot:f}}
function sizeBook(){const vw=innerWidth,avail=book.clientHeight-48;R.two=vw>=960;
  let ph,pw;if(R.two){ph=Math.min(860,avail);pw=Math.min(ph*0.72,(vw-130)/2);ph=Math.min(ph,pw/0.62)}else{pw=Math.min(vw-16,560);ph=Math.min(avail-40,pw*1.9)}
  document.documentElement.style.setProperty('--pw',Math.floor(pw)+'px');document.documentElement.style.setProperty('--ph',Math.floor(ph)+'px');
  book.classList.toggle('two',R.two);book.classList.toggle('one',!R.two)}
function paginate(){const {blocks,M}=build(R.id);const meas=$('#measure');meas.className='measure '+M.cls+' '+(R.two?'two':'one');meas.innerHTML='';
  const wrap=el('div',{class:'slot'});meas.appendChild(wrap);
  const pages=[];const cov=mkPage(M,true);cov.body.innerHTML=`<img class="cover-img" src="${M.cover}" alt="${M.title} 표지"><div class="cover-txt"><span class="cover-k">철수세미 · ${M.kicker}</span><span class="cover-s">${M.sub}</span><span class="cover-h">이번 호에서는</span><ul class="cover-l">${M.teaser.map(t=>`<li>${t}</li>`).join('')}</ul><span class="cover-i">철수세미 온라인 잡지 · 2026 가을</span></div>`;pages.push(cov);
  let pg=mkPage(M);wrap.appendChild(pg.el);
  const over=()=>{const L=pg.body.lastElementChild;if(!L)return false;const br=pg.body.getBoundingClientRect();return L.getBoundingClientRect().bottom-br.top>pg.body.clientHeight-30};
  for(const b of blocks){pg.body.appendChild(b);
    if(over()&&pg.body.children.length>1){pg.body.removeChild(b);const carry=[b];const last=pg.body.lastElementChild;if(last&&last.matches('h2.sec')&&pg.body.children.length>1){pg.body.removeChild(last);carry.unshift(last)}
      pages.push(pg);wrap.removeChild(pg.el);pg=mkPage(M);wrap.appendChild(pg.el);carry.forEach(c=>pg.body.appendChild(c));}
    if(over()&&pg.body.children.length===1)pg.body.classList.add('tall')}
  pages.push(pg);wrap.removeChild(pg.el);
  pages.forEach((p,i)=>{if(i){p.foot.textContent=i;const first=[...p.body.children].find(x=>x._sec!==undefined);p.head.lastChild.textContent=first?first._sec:''}});
  meas.innerHTML='';R.pages=pages;}
function spreadPages(s){if(!R.two)return[null,R.pages[s]];return[s===0?null:R.pages[2*s-1],R.pages[2*s]||null]}
function maxSpread(){return R.two?Math.ceil(R.pages.length/2):R.pages.length-1}
function show(s){R.spread=Math.max(0,Math.min(maxSpread(),s));const [l,r]=spreadPages(R.spread);slotL.innerHTML='';slotR.innerHTML='';
  if(l)slotL.appendChild(l.el);if(r)slotR.appendChild(r.el);[l,r].forEach(p=>{if(p&&!p.el.classList.contains('cover'))p.body.classList.toggle('tall',p.body.scrollHeight>p.body.clientHeight+2)});slotL.classList.toggle('empty',!l);slotR.classList.toggle('empty',!r);
  requestAnimationFrame(()=>CANV.forEach(st=>{if(st.draw&&st.w&&visible(st.c))st.draw()}));
  $('#prev').disabled=R.spread===0;$('#next').disabled=R.spread>=maxSpread();
  const pr=$('#pageRange');pr.max=maxSpread();pr.value=R.spread;
  const idx=R.two?[2*R.spread-1,2*R.spread].filter(i=>i>0&&i<R.pages.length):[R.spread].filter(i=>i>0);
  $('#pageLbl').textContent=(idx.length?idx.join('–'):'표지')+' / '+(R.pages.length-1);buildToc()}
function anim(node,frames,ms){return node.animate(frames,{duration:ms,easing:'cubic-bezier(.4,.1,.3,1)',fill:'forwards'}).finished}
let busy=false;
async function turn(dir){const t=R.spread+dir;if(busy||t<0||t>maxSpread())return;if(reduced){show(t);return}busy=true;
  try{
  const [ol,or]=spreadPages(R.spread),[nl,nr]=spreadPages(t);
  const mkLeaf=(page,side)=>{const lf=el('div',{class:'leaf '+side});lf.style.left=side==='l'?'0':'var(--pw)';if(!R.two)lf.style.left='0';lf.appendChild(page.el);spreadEl.appendChild(lf);return lf};
  if(R.two){
    if(dir>0){ if(or){const lf=mkLeaf(or,'r');slotR.innerHTML='';if(nr)slotR.appendChild(nr.el);slotR.classList.toggle('empty',!nr);
        await anim(lf,[{transform:'rotateY(0)',transformOrigin:'left center'},{transform:'rotateY(-90deg)',transformOrigin:'left center'}],260);lf.remove()}
      if(nl){const lf=mkLeaf(nl,'l');await anim(lf,[{transform:'rotateY(90deg)',transformOrigin:'right center'},{transform:'rotateY(0)',transformOrigin:'right center'}],260);lf.remove()}}
    else{ if(ol){const lf=mkLeaf(ol,'l');slotL.innerHTML='';if(nl)slotL.appendChild(nl.el);slotL.classList.toggle('empty',!nl);
        await anim(lf,[{transform:'rotateY(0)',transformOrigin:'right center'},{transform:'rotateY(90deg)',transformOrigin:'right center'}],260);lf.remove()}
      if(nr){const lf=mkLeaf(nr,'r');await anim(lf,[{transform:'rotateY(-90deg)',transformOrigin:'left center'},{transform:'rotateY(0)',transformOrigin:'left center'}],260);lf.remove()}}
  }else{
    if(dir>0){const lf=mkLeaf(or,'r');slotR.innerHTML='';slotR.appendChild(nr.el);await anim(lf,[{transform:'rotateY(0)',transformOrigin:'left center',opacity:1},{transform:'rotateY(-100deg)',transformOrigin:'left center',opacity:.6}],380);lf.remove()}
    else{const lf=mkLeaf(nr,'r');await anim(lf,[{transform:'rotateY(-100deg)',transformOrigin:'left center',opacity:.6},{transform:'rotateY(0)',transformOrigin:'left center',opacity:1}],380);lf.remove()}
  }}finally{busy=false;spreadEl.querySelectorAll('.leaf').forEach(x=>x.remove());show(t)}}
function pageOf(node){return R.pages.findIndex(p=>p.body.contains(node))}
function gotoNode(node){if(R.mode==='book'){const i=pageOf(node);if(i<0)return;show(R.two?Math.ceil(i/2):i)}else{node.scrollIntoView({behavior:reduced?'auto':'smooth',block:'start'})}closeToc()}
function currentAnchor(){if(R.mode==='book'){const [l,r]=spreadPages(R.spread);const p=l||r;return p&&p.body.firstElementChild}
  const bl=BUILT[R.id].blocks;const y=$('.bar').getBoundingClientRect().bottom+10;return bl.find(b=>b.getBoundingClientRect().bottom>y)}

function layout(keep){const anchor=keep?currentAnchor():null;const {blocks,M}=build(R.id);
  reader.className=M.cls;$('#nowTitle').textContent=M.kicker+' · '+M.title;
  if(R.mode==='book'){$('#scroll').hidden=true;book.hidden=false;sizeBook();paginate();
    let s=0;if(anchor){const i=pageOf(anchor);if(i>0)s=R.two?Math.ceil(i/2):i}show(s)}
  else{book.hidden=true;$('#scroll').hidden=false;slotL.innerHTML='';slotR.innerHTML='';const art=$('#article');art.innerHTML='';
    $('#scrollHero').src=M.cover;$('#scrollHero').alt=M.title+' 표지';blocks.forEach(b=>art.appendChild(b));
    if(anchor&&anchor!==blocks[0])requestAnimationFrame(()=>anchor.scrollIntoView({block:'start'}));else scrollTo(0,0);buildToc()}
  $('#mBook').setAttribute('aria-pressed',R.mode==='book');$('#mScroll').setAttribute('aria-pressed',R.mode==='scroll')}

function buildToc(){const nav=$('#tocNav');nav.innerHTML='';{const h=el('button',{class:'it'},'<span>← 서가(처음 화면)로</span>');h.onclick=()=>goHome('');nav.appendChild(h)}
  for(const id of Object.keys(MAGS)){const M=MAGS[id];const g=el('div',{class:'mg '+M.cls});const t=el('button',{class:'mg-t'},M.title);t.onclick=()=>{location.hash=id;closeToc()};g.appendChild(t);
    if(id===R.id){const {blocks}=build(id);blocks.forEach(b=>{if(b.matches('h2.sec')||b.dataset.w){const isW=!!b.dataset.w;const pn=R.mode==='book'?pageOf(b):-1;
      const it=el('button',{class:'it'+(isW?' w-it':'')},`<span>${isW?'▸ '+b.dataset.name:b.textContent.replace(/^(\d+)/,'$1 ')}</span><span class="pn">${pn>0?pn+'쪽':''}</span>`);it.onclick=()=>gotoNode(b);g.appendChild(it)}})}
    nav.appendChild(g)}}
function openToc(){$('#toc').classList.add('open');$('#scrim').classList.add('on')}
function closeToc(){$('#toc').classList.remove('open');$('#scrim').classList.remove('on')}

function route(){const id=location.hash.slice(1);if(MAGS[id]){$('#home').hidden=true;reader.hidden=false;$('#tocBtn').hidden=false;$('#modeSeg').hidden=false;$('#homeBtn').hidden=false;document.body.classList.add('reading');R.id=id;layout(false);window.scrollTo(0,0)}
  else{reader.hidden=true;$('#home').hidden=false;$('#tocBtn').hidden=true;$('#modeSeg').hidden=true;$('#homeBtn').hidden=true;document.body.classList.remove('reading');$('#nowTitle').textContent='';R.id=null}}

R.mode=store.get('mag-mode2')||'scroll';
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{location.hash=b.dataset.open});
function goHome(id){closeToc();if(id){location.hash=id}else{history.pushState('', '', location.pathname);route()}window.scrollTo(0,0)}
$('#toHome').onclick=()=>goHome('');$('#homeBtn').onclick=()=>goHome('');
$('#mBook').onclick=()=>{if(R.mode!=='book'){R.mode='book';store.set('mag-mode2','book');layout(true)}};
$('#mScroll').onclick=()=>{if(R.mode!=='scroll'){R.mode='scroll';store.set('mag-mode2','scroll');layout(true)}};
$('#tocBtn').onclick=openToc;$('#tocX').onclick=closeToc;$('#scrim').onclick=closeToc;
$('#prev').onclick=()=>turn(-1);$('#next').onclick=()=>turn(1);
$('#pageRange').oninput=e=>show(+e.target.value);
addEventListener('keydown',e=>{if(R.mode!=='book'||reader.hidden)return;if(/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;if(e.key==='ArrowRight')turn(1);if(e.key==='ArrowLeft')turn(-1);if(e.key==='Escape')closeToc()});
let sw=null;book.addEventListener('pointerdown',e=>{if(e.target.closest('.w,input,button,details,audio'))return;sw={x:e.clientX,y:e.clientY}});
book.addEventListener('pointerup',e=>{if(!sw)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;sw=null;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3)turn(dx<0?1:-1)});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(R.id&&R.mode==='book')layout(true)},200)});
addEventListener('hashchange',route);
document.fonts&&document.fonts.ready.then(()=>{if(R.id&&R.mode==='book')layout(true)});
route();
</script>

</body>
</html>
