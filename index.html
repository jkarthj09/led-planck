<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>LED 플랑크 상수 탐구</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700;800&display=swap">
<style>
/* Layout: 철수세미 잡지 서가와 같은 책상 위에 표지 두 장. 표지 위에 '어른용', '어린이용'을 크게 달아 먼저 고르게 한다.
   잡지와 같은 종이·책상 색과 Jua + 나눔고딕을 써서, 들어가기 전부터 같은 잡지처럼 보이게 한다. 종이 질감의 밝은 테마 하나로 고정. */
:root{
  color-scheme:light;
  --desk:#e6e1d6; --paper:#fffdf8; --ink:#1f2a30; --muted:#5f6a70; --line:#e2dbcd; --shade:#d3ccbe;
  --adult:#1f6f62; --adult-mark:#8ce2ce;
  --kid:#4a3fc2; --kid-mark:#f2a516;
  --f-disp:'Jua','Nanum Gothic','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-body:'Nanum Gothic','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:56px;display:flex;align-items:center;gap:12px;background:var(--paper);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--f-disp);font-size:20px;letter-spacing:.02em;white-space:nowrap}
.brand span{color:var(--adult)}
.bar .by{margin-left:auto;font-size:14px;color:var(--muted);white-space:nowrap}

main{max-width:1080px;margin:0 auto;padding-block:40px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-family:var(--f-disp);font-weight:normal;font-size:clamp(30px,5vw,46px);line-height:1.2;margin:0 0 6px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 32px}

.shelf{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:36px 28px}
.slot{display:grid;gap:12px;align-content:start;min-width:0}
.who{font-family:var(--f-disp);font-weight:normal;font-size:clamp(30px,4.4vw,40px);line-height:1.1;margin:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.who span{padding:0 4px}
.who small{font-family:var(--f-body);font-size:15px;color:var(--muted)}
.adult .who span{color:var(--adult);background:linear-gradient(transparent 60%,color-mix(in srgb,var(--adult-mark) 70%,transparent) 60%)}
.kid .who span{color:var(--kid);background:linear-gradient(transparent 60%,color-mix(in srgb,var(--kid-mark) 45%,transparent) 60%)}

.card{background:var(--paper);border-radius:6px;overflow:hidden;box-shadow:0 1px 0 var(--shade),0 18px 40px -22px rgba(60,40,10,.45);display:flex;flex-direction:column;color:inherit;text-decoration:none;transition:transform .2s}
.adult .card:hover{transform:translateY(-4px) rotate(-.4deg)}
.kid .card:hover{transform:translateY(-4px) rotate(.4deg)}
.card:focus-visible{outline:3px solid var(--kid-mark);outline-offset:3px}
.card img{display:block;width:100%;max-width:100%;aspect-ratio:16/10;object-fit:cover}
.meta{padding:16px 20px 20px;display:grid;gap:4px}
.kicker{font-size:13px;letter-spacing:.12em}
.adult .kicker{color:var(--adult)}
.kid .kicker{color:var(--kid)}
.t{font-family:var(--f-disp);font-size:24px;line-height:1.3}
.d{color:var(--muted);font-size:15px}

footer{margin-top:40px;color:var(--muted);font-size:14px}
footer p{margin:0}
@media (max-width:560px){.bar .by{display:none}.brand{font-size:18px}}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none!important}}
</style>
</head>
<body>

<header class="bar">
  <span class="brand">철수세미 <span>탐구</span></span>
  <span class="by">물리 · 박혁진</span>
</header>

<main>
  <h1>LED로 잰 플랑크 상수</h1>
  <p class="sub">같은 실험을 두 가지로 썼어요. 읽을 사람에 맞게 골라 주세요.</p>

  <div class="shelf">
    <section class="slot adult">
      <h2 class="who"><span>어른용</span></h2>
      <a class="card" href="note.html" id="go-note">
        <img src="cover-note-l.jpg" alt="연구 노트 표지. 빨간 LED 전압 1.81 V를 보여 주는 멀티미터">
        <div class="meta">
          <span class="kicker">연구 노트</span>
          <span class="t">LED 문턱전압으로 플랑크 상수 구하기</span>
          <span class="d">원데이터와 계산 과정, 오차 분석까지 다 실었어요. 비유 없이 숫자와 식으로 설명해요.</span>
        </div>
      </a>
    </section>

    <section class="slot kid">
      <h2 class="who"><span>어린이용</span></h2>
      <a class="card" href="magazine.html#led" id="go-mag">
        <img src="cover-mag-l.jpg" alt="잡지 표지. 브레드보드 위에 켜진 파란 LED">
        <div class="meta">
          <span class="kicker">잡지 기사</span>
          <span class="t">LED 속 미끄럼틀의 높이를 재는 법</span>
          <span class="d">미끄럼틀, 환율, 택시 요금으로 풀어 썼어요. 직접 해 보는 프로그램이 3개 있어요.</span>
        </div>
      </a>
    </section>
  </div>

  <footer><p>측정 2026년 11월 6일·8일·9일, 학교 물리 실험실</p></footer>
</main>

</body>
</html>
